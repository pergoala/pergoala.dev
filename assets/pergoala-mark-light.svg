<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pergoala mark light">
  <title>Pergoala Development Methodology</title>
  <defs>
    <linearGradient id="pg-vine-l" x1="12" y1="54" x2="52" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B6E4B"/>
      <stop offset="60%" stop-color="#0E8A5E"/>
      <stop offset="100%" stop-color="#19A974"/>
    </linearGradient>
  </defs>

  <!-- Overhead pergola canopy rafters -->
  <g stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <line x1="13" y1="11" x2="51" y2="11" stroke="#475569" stroke-width="2.2"/>
    <line x1="18" y1="11" x2="18" y2="18"/>
    <line x1="27.3" y1="11" x2="27.3" y2="18"/>
    <line x1="36.7" y1="11" x2="36.7" y2="18"/>
    <line x1="46" y1="11" x2="46" y2="18"/>
  </g>

  <!-- Primary architectural pergola frame -->
  <path d="M7 18 H57" stroke="#141921" stroke-width="4" stroke-linecap="round"/>
  <path d="M18 18 V54" stroke="#1E293B" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M46 18 V54" stroke="#1E293B" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Subtle mid-span structural tie-beam -->
  <path d="M18 35 H46" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/>

  <!-- Organic climbing vine -->
  <path d="M14 53 C18 46, 20 39, 27 35 C34 31, 41 28, 46 21 C48 18, 50 15, 52 11"
        fill="none" stroke="url(#pg-vine-l)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tendril leaf -->
  <path d="M23 38 C20 33, 22 27, 28 26 C28 31, 26 35, 23 38 Z" fill="#0E8A5E" opacity="0.9"/>

  <!-- Anchor nodes -->
  <circle cx="18" cy="46.5" r="2.2" fill="#F7F6F2" stroke="#0E8A5E" stroke-width="1.8"/>
  <circle cx="46" cy="21" r="2.2" fill="#F7F6F2" stroke="#0E8A5E" stroke-width="1.8"/>

  <!-- Goal Beacon -->
  <circle cx="53" cy="10" r="5" fill="#D98A1A" opacity="0.22"/>
  <circle cx="53" cy="10" r="3.2" fill="#D98A1A"/>
</svg>
